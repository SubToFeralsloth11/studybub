name: Quality and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run lint:duplication

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: bun run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: build-output
          path: .output/
          # Nitro emits to .output/, which upload-artifact@v5 treats as hidden
          # by default (include-hidden-files: false) and silently uploads
          # nothing. Opt in so the deploy job can download the bundle.
          include-hidden-files: true
          retention-days: 1

  e2e-tests:
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium --with-deps

      # Diagnostic: boot the dev server under bun with verbose logging and a
      # hard timeout, then probe the port. The log is written outside the
      # repository (under /tmp) so Vite's file watcher does not see it - writing
      # the log inside the watched tree caused a churning HMR feedback loop that
      # slowed the dev server and destabilised the subsequent E2E run. The log
      # is uploaded regardless of the E2E result so a hang in Vite/plugin
      # startup is attributable.
      - name: Diagnose dev server startup
        run: |
          set +e
          mkdir -p /tmp/dev-diag
          # Run in a new session so we can tear down the whole process group,
          # including any Nitro/worker children bun spawns.
          setsid bash -c 'VITE_BYPASS_AUTH=true bun --bun vite dev --debug > /tmp/dev-diag/dev.log 2>&1' &
          DEV_PID=$!
          echo "dev server pid: $DEV_PID (pgid $DEV_PID)"
          # Poll the port for up to 90s, but stop sooner if the process exits.
          for i in $(seq 1 90); do
            if ! kill -0 "$DEV_PID" 2>/dev/null; then
              echo "dev server exited early after ${i}s"
              break
            fi
            if curl -sS -m 2 -o /dev/null http://127.0.0.1:3000/; then
              echo "dev server responded after ${i}s"
              break
            fi
            sleep 1
          done
          echo "=== dev.log ==="
          cat /tmp/dev-diag/dev.log
          # Kill the entire process group to avoid leaving vite/nitro children
          # on the runner before Playwright starts its own server.
          kill -- -"$DEV_PID" 2>/dev/null || kill "$DEV_PID" 2>/dev/null || true
          wait "$DEV_PID" 2>/dev/null || true

      - run: bun run test:e2e

      - name: Upload dev server diagnostic log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: dev-diag
          path: /tmp/dev-diag/
          retention-days: 7

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker-build:
    name: Build and push Docker image
    needs: [static-analysis, unit-tests, build, e2e-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
